services:
  - type: web
    name: blockballot
    runtime: node
    plan: free
    branch: main
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: FIREBASE_PROJECT_ID
        value: e-voting-system-india
      - key: FIRESTORE_DATABASE_ID
        value: (default)

